name: Verify automatic LAN retirement without disconnecting active sessions
on:
  push:
    branches: [feature/lan-fermeture-inactivite-071]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-lan-idle
  cancel-in-progress: true
jobs:
  lan-retirement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Compile and run all Python tests
        run: |
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate browser scripts
        run: |
          node --check web/host-shell.js
          node --check web/tutorial.js
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Regress automatic activation and host menu
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: |
          node tests/browser_auto_lan.cjs
          node tests/browser_desktop.cjs
      - name: Regress concurrent tournament viewers
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_four_clients.cjs
      - name: Regress shared live tutorial
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial_shared.cjs
