name: Verify read-only live tutorial feature
on:
  push:
    branches: [feature/tutoriel-partage-071]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-tutorial-feature
  cancel-in-progress: true
jobs:
  tutorial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Qt test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Compile Python modules
        run: python3 -m compileall -q src tests
      - name: Exercise all game, tutorial, auth and tournament tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Test genuine native QtWebEngine startup
        timeout-minutes: 3
        run: xvfb-run -a -s '-screen 0 1440x900x24' /usr/bin/python3 tests/native_qt_smoke.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check web/tutorial.js
          node --check web/tutorial-view.js
          node --check tests/browser_tutorial_shared.cjs
      - name: Install Chromium testing dependencies
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Regression standard host tutorial
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial.cjs
      - name: Exercise shared live tutorial with phone-style read-only browser
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial_shared.cjs
      - name: Regression native host/tournament shell
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_desktop.cjs
      - name: Regression 3D game and cinematic presentation
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_board3d.cjs
