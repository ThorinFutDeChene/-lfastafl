name: Verify tournament formats, byes and knockout replays
on:
  push:
    branches: [feature/tournoi-formats-cas-limites-071]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-tournament-formats
  cancel-in-progress: true
jobs:
  formats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install testing prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Compile project and run full Python regression suite
        run: |
          python3 -m compileall -q src tests
          PYTHONPATH=src python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check web/tournament-ui.js
          node --check tests/browser_tournament_edge_formats.cjs
          node --check tests/browser_tournament_four_clients.cjs
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tournament formats in native host UI
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_edge_formats.cjs
      - name: Regression four independent players and spectator
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_four_clients.cjs
      - name: Regression host menus and contextual format help
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_desktop.cjs
