name: Validate QR tournament registration and podium
on:
  push:
    branches: [feature/tournoi-qr-inscriptions-auto-073]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-qr-tournament-feature
  cancel-in-progress: true
jobs:
  tournament-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Run all server test cases
        env:
          PYTHONPATH: src
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: |
          for file in web/*.js tests/*.cjs; do node --check "$file"; done
