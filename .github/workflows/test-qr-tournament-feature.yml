name: Validate QR tournament registration and podium
on:
  push:
    branches: [feature/tournoi-qr-inscriptions-auto-073]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-qr-tournament-feature
  cancel-in-progress: true
jobs:
  tournament-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Run all server test cases
        env:
          PYTHONPATH: src
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: |
          for file in web/*.js tests/*.cjs; do node --check "$file"; done
      - name: Install browser automation engines
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Exercise live QR registration, waiting board and medal ceremonies (Chromium)
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_qr_tournament_live.cjs
      - name: Regression native host shell and sidebar approvals
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_desktop.cjs
      - name: Regression historic tournament formats and replays
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_edge_formats.cjs
      - name: Regression four legacy participants and rotating spectators
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_four_clients.cjs
      - name: Exercise live QR registration on Safari WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: webkit
        run: node tests/browser_qr_tournament_live.cjs

