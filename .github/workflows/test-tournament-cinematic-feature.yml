name: Validate tournament combat cinematics
on:
  push:
    branches: [feature/tournament-combat-cinematics-dev6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-tournament-cinematics
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install unit test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth
      - name: Test capture setup, tournament flow and spectator streaming
        env:
          PYTHONPATH: src
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -p test_tournament_cinematics.py -v
          python3 -m unittest discover -s tests -p test_cinematic_time.py -v
          python3 -m unittest discover -s tests -p test_tournament_registration.py -v
          python3 -m unittest discover -s tests -p test_tournament_edge_formats.py -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Chromium and browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Existing QR tournament and four-client spectator regressions
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: |
          node tests/browser_qr_tournament_live.cjs
          node tests/browser_tournament_four_clients.cjs
