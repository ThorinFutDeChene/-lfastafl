name: Validate tournament history and deletion
on:
  push:
    branches: [feature/tournament-history-delete-072-dev5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-tournament-archive-feature
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install native Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Run all Python tests including archive durability and rollback
        env:
          PYTHONPATH: src
        run: |
          python3 -m compileall -q src tests
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in web/*.js tests/*.cjs; do node --check "$file"; done
      - name: Install Chromium and Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify historical results and confirmed deletion in host UI
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_history.cjs
      - name: Guard existing shell and QR tournament behavior
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: |
          node tests/browser_desktop.cjs
          node tests/browser_qr_tournament_live.cjs
