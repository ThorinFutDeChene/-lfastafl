name: Validate completed-game save cleanup
on:
  push:
    branches: [feature/no-finished-save-072-dev3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-no-finished-saves
  cancel-in-progress: true
jobs:
  unit-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python game dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil python3-pyqt6 python3-pyqt6.qtwebengine xvfb xauth x11-utils
      - name: Compile sources and test files
        run: python3 -m compileall -q src tests
      - name: Verify all saved-game scenarios and regression tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
