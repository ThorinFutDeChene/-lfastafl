name: Build and publish Álfastafl stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfastafl-stable-release
  cancel-in-progress: false

jobs:
  publish-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
      - name: Validate stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n\r' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'ERROR: a stable tag must have a release version without ~dev'; exit 1;
          }
          echo "deb=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil
      - name: Run unit and integration tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Set up Node for UI tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check delayed move responses
        run: node tests/ui_move_race.cjs
      - name: Install browser test dependencies
        timeout-minutes: 20
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Exercise the host tutorial in Chromium
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial.cjs
      - name: Verify QR-based read-only live tutorial with a guest browser
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial_shared.cjs
      - name: Verify automatic LAN activation (new game, saved game, tutorial)
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_auto_lan.cjs
      - name: Verify automatic LAN retirement policy and firewall lease timing
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_lan_idle.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_desktop_lan.py' -v
      - name: Verify odd tournament byes, Swiss points and knockout draw replays
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_edge_formats.cjs
      - name: Verify four independent tournament players and spectator broadcast
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tournament_four_clients.cjs
      - name: Verify shared QR tutorial under Firefox
        timeout-minutes: 7
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: firefox
        run: node tests/browser_tutorial_shared.cjs
      - name: Verify four-player tournament under Firefox
        timeout-minutes: 9
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: firefox
        run: node tests/browser_tournament_four_clients.cjs
      - name: Verify shared QR tutorial under WebKit (Safari engine)
        timeout-minutes: 7
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: webkit
        run: node tests/browser_tutorial_shared.cjs
      - name: Verify four-player tournament under WebKit (Safari engine)
        timeout-minutes: 9
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: webkit
        run: node tests/browser_tournament_four_clients.cjs
      - name: Exercise the 3D board in Chromium
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_board3d.cjs
      - name: Save tutorial UI screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: alfastafl-tutorial-ui
          path: test-results/tutorial-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save 3D board screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: alfastafl-board3d-ui
          path: test-results/board3d/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build stable Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sh packaging/build-deb.sh "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb"
          dpkg-deb --info "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb" Version)" = "${{ steps.version.outputs.deb }}"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb" Package)" = 'alfastafl'
      - name: Bundle sources and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='__pycache__' --exclude='dist' --exclude='.git' \
            -czf "dist/alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz" \
            README.md RULES.md RELEASE_NOTES.md THIRD_PARTY_NOTICES.md LICENSE VERSION src web tests packaging .github
          cd dist
          sha256sum "alfastafl_${{ steps.version.outputs.deb }}_all.deb" \
            "alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz" > SHA256SUMS.txt
      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          prerelease: false
          make_latest: true
          name: 'Álfastafl ${{ steps.version.outputs.tag }} (Stable)'
          body_path: RELEASE_NOTES.md
          files: |
            dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb
            dist/alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
