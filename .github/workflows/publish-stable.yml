name: Build and publish Álfastafl stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfastafl-stable-release
  cancel-in-progress: false

jobs:
  publish-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
      - name: Validate stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n\r' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'ERROR: a stable tag must have a release version without ~dev'; exit 1;
          }
          echo "deb=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil
      - name: Run unit and integration tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build stable Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sh packaging/build-deb.sh "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb"
          dpkg-deb --info "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb" Version)" = "${{ steps.version.outputs.deb }}"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb" Package)" = 'alfastafl'
      - name: Bundle sources and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='__pycache__' --exclude='dist' --exclude='.git' \
            -czf "dist/alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz" \
            README.md RULES.md RELEASE_NOTES.md LICENSE VERSION src web tests packaging .github
          cd dist
          sha256sum "alfastafl_${{ steps.version.outputs.deb }}_all.deb" \
            "alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz" > SHA256SUMS.txt
      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          prerelease: false
          make_latest: true
          name: 'Álfastafl ${{ steps.version.outputs.tag }} (Stable)'
          body_path: RELEASE_NOTES.md
          files: |
            dist/alfastafl_${{ steps.version.outputs.deb }}_all.deb
            dist/alfastafl_${{ steps.version.outputs.deb }}_sources.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
