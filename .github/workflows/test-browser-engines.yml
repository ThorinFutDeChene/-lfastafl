name: Verify Firefox and WebKit tournament compatibility
on:
  push:
    branches: [feature/compat-firefox-webkit-071]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alfastafl-browser-engines-qa
  cancel-in-progress: true
jobs:
  browser-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil
      - name: Check test and server Python syntax
        run: python3 -m compileall -q src tests
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check browser regression script syntax
        run: |
          node --check tests/browser_tutorial_shared.cjs
          node --check tests/browser_tournament_four_clients.cjs
      - name: Install Firefox and WebKit testing engines
        timeout-minutes: 20
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps firefox webkit
      - name: Verify Firefox QR tutorial
        timeout-minutes: 7
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: firefox
        run: node tests/browser_tutorial_shared.cjs
      - name: Verify Firefox four-player tournament
        timeout-minutes: 9
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: firefox
        run: node tests/browser_tournament_four_clients.cjs
      - name: Verify WebKit QR tutorial
        timeout-minutes: 7
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: webkit
        run: node tests/browser_tutorial_shared.cjs
      - name: Verify WebKit four-player tournament
        timeout-minutes: 9
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
          ALFASTAFL_BROWSER: webkit
        run: node tests/browser_tournament_four_clients.cjs
