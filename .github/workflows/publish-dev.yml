name: Build and publish Álfastafl DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfastafl-dev-release
  cancel-in-progress: false

jobs:
  publish-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Read prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n\r' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+~dev[0-9]+$ ]] || exit 1
          echo "deb=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=${VERSION/\~/_}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION/\~/-}" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil
      - name: Run unit and integration tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build Debian package
        run: |
          mkdir -p dist
          sh packaging/build-deb.sh "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb"
          dpkg-deb --info "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb" Version)" = "${{ steps.version.outputs.deb }}"
      - name: Bundle sources and checksums
        run: |
          tar --exclude='__pycache__' --exclude='dist' --exclude='.git' \
            -czf "dist/alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz" \
            README.md RELEASE_NOTES.md LICENSE VERSION src web tests packaging .github
          cd dist
          sha256sum "alfastafl_${{ steps.version.outputs.file }}_all.deb" \
            "alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz" > SHA256SUMS.txt
      - name: Publish prerelease (DEV only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: dev
          prerelease: true
          make_latest: false
          name: 'Álfastafl ${{ steps.version.outputs.tag }} (DEV)'
          body_path: RELEASE_NOTES.md
          files: |
            dist/alfastafl_${{ steps.version.outputs.file }}_all.deb
            dist/alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
