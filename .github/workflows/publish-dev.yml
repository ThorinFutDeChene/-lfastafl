name: Build and publish Álfastafl DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfastafl-dev-release
  cancel-in-progress: false

jobs:
  publish-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Read prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n\r' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+~dev[0-9]+$ ]] || exit 1
          echo "deb=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=${VERSION/\~/_}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION/\~/-}" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-qrcode python3-pil
      - name: Run unit and integration tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Set up Node for UI tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check delayed move responses
        run: node tests/ui_move_race.cjs
      - name: Verify generated audio and independent volume controls
        run: node tests/ui_audio.cjs
      - name: Verify deterministic cinematic fight choreography
        run: node tests/ui_combat_motion.cjs
      - name: Verify flank combat storyboards and supporting allies
        run: node tests/ui_flank_capture.cjs
      - name: Verify the historical and corner royal escape choreography
        run: node tests/ui_king_escape.cjs
      - name: Verify rule-specific king defeat choreography (2, 3, 4 dwarves)
        run: node tests/ui_king_siege.cjs
      - name: Verify two-way captures against the hostile empty throne
        run: node tests/ui_throne_capture.cjs
      - name: Install tutorial browser test dependencies
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/alfastafl-ui" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/alfastafl-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the host tutorial in Chromium
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_tutorial.cjs
      - name: Verify separate fullscreen host windows and spectator QR
        timeout-minutes: 4
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_desktop.cjs
      - name: Exercise the 3D board in Chromium
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/alfastafl-ui/node_modules
        run: node tests/browser_board3d.cjs
      - name: Save tutorial UI screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: alfastafl-tutorial-ui
          path: test-results/tutorial-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save 3D board screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: alfastafl-board3d-ui
          path: test-results/board3d/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Debian package
        run: |
          mkdir -p dist
          sh packaging/build-deb.sh "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb"
          dpkg-deb --info "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb"
          test "$(dpkg-deb -f "dist/alfastafl_${{ steps.version.outputs.file }}_all.deb" Version)" = "${{ steps.version.outputs.deb }}"
      - name: Bundle sources and checksums
        run: |
          tar --exclude='__pycache__' --exclude='dist' --exclude='.git' \
            -czf "dist/alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz" \
            README.md RULES.md RELEASE_NOTES.md THIRD_PARTY_NOTICES.md LICENSE VERSION src web tests packaging .github
          cd dist
          sha256sum "alfastafl_${{ steps.version.outputs.file }}_all.deb" \
            "alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz" > SHA256SUMS.txt
      - name: Publish prerelease (DEV only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: dev
          prerelease: true
          make_latest: false
          name: 'Álfastafl ${{ steps.version.outputs.tag }} (DEV)'
          body_path: RELEASE_NOTES.md
          files: |
            dist/alfastafl_${{ steps.version.outputs.file }}_all.deb
            dist/alfastafl_${{ steps.version.outputs.file }}_sources.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
